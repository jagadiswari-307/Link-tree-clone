<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Linktree</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2,#ff758c);
    background-size:400% 400%;
    animation:gradient 10s ease infinite;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:400px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.profile-pic{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-bottom:15px;
}

h1{
    color:white;
    margin-bottom:10px;
}

p{
    color:white;
    margin-bottom:25px;
}

.link{
    display:block;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.2);
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    transition:0.3s;
    font-weight:bold;
}

.link:hover{
    background:white;
    color:#764ba2;
    transform:translateY(-3px);
}

.socials{
    margin-top:20px;
}

.socials a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    font-size:20px;
}
</style>
</head>
<body>

<div class="container">

    <img src="https://via.placeholder.com/120" alt="Profile" class="profile-pic">

    <h1>Your Name</h1>
    <p>Student • Creator • Developer</p>

    <a href="https://github.com" class="link" target="_blank">GitHub</a>

    <a href="https://linkedin.com" class="link" target="_blank">LinkedIn</a>

    <a href="https://instagram.com" class="link" target="_blank">Instagram</a>

    <a href="https://youtube.com" class="link" target="_blank">YouTube</a>

    <div class="socials">
        <a href="#">📷</a>
        <a href="#">🎥</a>
        <a href="#">💼</a>
    </div>

</div>

</body>
</html>
