<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Tree Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        -45deg,
        #ff6b6b,
        #ff9f43,
        #48dbfb,
        #5f27cd,
        #00d2d3
    );
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:450px;
    text-align:center;
}

h1{
    color:white;
    margin-bottom:35px;
    font-size:2.5rem;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}

.links{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.link{
    text-decoration:none;
    color:white;
    padding:18px;
    border-radius:20px;
    backdrop-filter:blur(12px);
    background:rgba(209, 129, 215, 0.701);
    border:1px solid rgba(255,255,255,0.3);
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.link:hover{
    transform:scale(1.05);
    background:rgba(163, 200, 224, 0.25);
}

/* Zig Zag Alignment */

.link:nth-child(odd){
    margin-right:60px;
}

.link:nth-child(even){
    margin-left:60px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Link Tree Clone</h1>

    <p class="bio">
        Connect all your important links in one place.
    </p>

    <div class="links">

<a href="https://in.pinterest.com/" class="link-btn" target="_blank">
        Pinterest
    </a>

    <a href="https://abhyas.ai/beta/#/student" class="link-btn" target="_blank">
        abhyas
    </a>

    <a href="https://www.youtube.com/" class="link-btn" target="_blank">
        Youtube
    </a>
      

    </div>

</div>

</body>
</html>
