<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Tree Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.container{
    width:90%;
    max-width:400px;
    text-align:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.logo{
    width:140px;
    height:140px;
    object-fit:contain;
    margin-bottom:15px;
}

h1{
    color:rgb(12, 11, 11);
    margin-bottom:10px;
    font-size:32px;
}

p{
    color:#93945c;
    margin-bottom:25px;
}

.link{
    display:block;
    text-decoration:none;
    color:rgb(181, 237, 224);
    background:rgba(255,255,255,0.15);
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    transition:0.3s;
    font-weight:bold;
}

.link:hover{
    background:white;
    color:#3b2043;
    transform:translateY(-3px);
}

.socials{
    margin-top:20px;
}

.socials a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    font-size:22px;
}
</style>
</head>
<body>

<div class="container">

    <!-- Your uploaded logo -->
    <img src="" alt="" class="logo">

    <h1>Link Tree Clone</h1>

      <p class="bio">
        Connect all your important links in one place.
    </p>

    <a href="https://in.pinterest.com/" class="link-btn" target="_blank">
        Pinterest
    </a>

    <a href="https://abhyas.ai/beta/#/student" class="link-btn" target="_blank">
        abhyas
    </a>

    <a href="https://www.youtube.com/" class="link-btn" target="_blank">
        Youtube
    </a>

</div>
